[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elfetch"
version = "0.3.0"
description = "Find the cheapest offer (price + shipping to your country) for electronic parts across many shops."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "rich>=13",
    "typer>=0.12",
    "platformdirs>=4",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
browser = ["playwright>=1.45"]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
elfetch = "elfetch.__main__:main"

[tool.setuptools.packages.find]
include = ["elfetch*"]

[tool.setuptools.package-data]
elfetch = ["data/*.toml", "data/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
