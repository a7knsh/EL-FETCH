name: Flatpak

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["packaging/flatpak/**", "elfetch/**", "pyproject.toml", ".github/workflows/flatpak.yml"]
  workflow_dispatch:

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak + Flathub builder
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
      - name: Build
        run: |
          flatpak run org.flatpak.Builder --user --install-deps-from=flathub --force-clean --disable-rofiles-fuse \
            --repo=repo flatpak-build packaging/flatpak/io.github.a7knsh.EL_FETCH.yml
          flatpak build-bundle repo EL-FETCH.flatpak io.github.a7knsh.EL_FETCH \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Smoke test
        run: |
          flatpak install --user -y --noninteractive EL-FETCH.flatpak
          flatpak run io.github.a7knsh.EL_FETCH --help
      - name: Flathub lint
        run: |
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest packaging/flatpak/io.github.a7knsh.EL_FETCH.yml || true
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo || true
      - uses: actions/upload-artifact@v4
        with:
          name: EL-FETCH.flatpak
          path: EL-FETCH.flatpak
