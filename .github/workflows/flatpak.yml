name: Flatpak

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["packaging/flatpak/**", "elfetch/**", "pyproject.toml", ".github/workflows/flatpak.yml"]
  workflow_dispatch:

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak + Flathub builder
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak dbus
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder \
            org.kde.Platform//6.11 org.kde.Sdk//6.11 io.qt.PySide.BaseApp//6.11
      - name: Build
        run: |
          set -o pipefail
          dbus-run-session -- flatpak run org.flatpak.Builder --user --force-clean --disable-rofiles-fuse \
            --repo=repo flatpak-build packaging/flatpak/io.github.a7knsh.EL_FETCH.yml 2>&1 | tee build.log || {
            # job logs need a GitHub login; annotations don't, so the failure is readable from the public API
            echo "::error title=flatpak-builder::$(tail -n 40 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }
          flatpak build-bundle repo EL-FETCH.flatpak io.github.a7knsh.EL_FETCH \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Smoke test
        run: |
          flatpak install --user -y --noninteractive EL-FETCH.flatpak
          flatpak run io.github.a7knsh.EL_FETCH --help
      - name: Flathub lint
        run: |
          for what in "manifest packaging/flatpak/io.github.a7knsh.EL_FETCH.yml" "repo repo"; do
            out=$(flatpak run --command=flatpak-builder-lint org.flatpak.Builder $what 2>&1) ||
              echo "::warning title=lint ${what%% *}::$(echo "$out" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: EL-FETCH.flatpak
          path: EL-FETCH.flatpak
