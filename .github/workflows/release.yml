name: Build & release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04          # older glibc -> runs on most distros
            asset: EL-FETCH-linux-x86_64
            file: dist/EL-FETCH
          - os: windows-latest
            asset: EL-FETCH-windows-x64.exe
            file: dist/EL-FETCH.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - run: pip install -e ".[gui,dev]"
      - run: pytest -q
      - run: python scripts/build.py
      - name: Smoke test
        run: ${{ matrix.file }} --help
      - name: AppImage
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGETOOL=$PWD/appimagetool python scripts/build.py --appimage
          APPIMAGE_EXTRACT_AND_RUN=1 dist/EL-FETCH-x86_64.AppImage --help
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = python -c "import elfetch; print(elfetch.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\windows\elfetch.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Rename
        shell: bash
        run: mv "${{ matrix.file }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/EL-FETCH-Setup.exe
            dist/EL-FETCH-x86_64.AppImage
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
